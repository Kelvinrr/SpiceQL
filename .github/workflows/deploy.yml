name: Deploy

on:
  workflow_run:
    workflows: ["Build-And-Test"]
    branches: [main]
    types:
      - completed

env:
  ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}

jobs:
  anaconda-deploy:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash -l {0}
    steps:
    - uses: actions/checkout@v2
    - uses: conda-incubator/setup-miniconda@v2
      with:
          miniconda-version: "latest"
          auto-activate-base: true
          auto-update-conda: true
    - name: Setup conda tools
      run: |
          conda config --set always_yes yes
          conda config --set anaconda_upload yes
          conda install -c conda-forge conda-build anaconda-client conda-verify
    - name: Build tarbll
      run: |
          export SPICEQL_VERSION=$(date +%Y.%m.%d)
          echo $SPICEQL_VERSION
          cd recipe
          sed -ie "s/{% set version = \"[^\"]*\" %}/{% set version = \"$SPICEQL_VERSION\" %}/" meta.yaml
          cat meta.yaml
          conda build --user usgs-astrogeology --label dev -c conda-forge -c tudat-team .

  pages-docs-deploy:
    runs-on: ubuntu-latest
    # workflow_run fires when Build-And-Test COMPLETES, whatever the outcome, so
    # this is what keeps a failed build from publishing.
    if: github.event.workflow_run.conclusion == 'success'
    # Needed by deploy-pages: `pages` to create the deployment, `id-token` for
    # the OIDC token it exchanges for one.
    permissions:
      contents: read
      pages: write
      id-token: write
    # Pages allows one deployment at a time. Queue rather than cancel, so a run
    # already uploading still finishes.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9
      - uses: conda-incubator/setup-miniconda@3b0f2504dd76ef23b6d31f291f4913fb60ab5ff3
        with:
            miniconda-version: "latest"
            activate-environment: spiceql
            channels: conda-forge
            environment-file: environment.yml
            auto-activate-base: false
            auto-update-conda: true
            
      - name: Conda info
        run: |
            conda info
            conda list
  
      - name: Build
        working-directory: ${{github.workspace}}
        # Execute the build.
        run: |
          mkdocs build
  
      - name: Check Build Docs
        working-directory: ${{github.workspace}}/site/
        # Check for the built docs
        run: |
            test -e index.html

      # Pages serves whatever this artifact contains, so unlike the old
      # `aws s3 sync --delete` there is nothing to prune: each deployment
      # replaces the site wholesale.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{github.workspace}}/site/

      - name: Deploy to GitHub Pages
        id: pages-deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

