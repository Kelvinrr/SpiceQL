name: Docs

# Publishes the site to the `docs_deployment` branch, which Pages serves
# (Settings -> Pages -> Deploy from a branch -> docs_deployment / (root)).
# That setting has to be switched by hand once, since it replaces the
# artifact-based deployment that used to live in deploy.yml.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      # mkdoxy generates the C++ API pages from the public headers, so a doc
      # comment there changes the site with nothing under docs/ moving.
      - 'SpiceQL/include/**'
      - 'environment.yml'
      - '.github/workflows/docs.yml'
  # For the first run, which creates the branch, and after a Pages settings change.
  workflow_dispatch:

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the site is pushed as a commit, not uploaded
    # Queue rather than cancel, so a run mid-push is never left half-committed.
    concurrency:
      group: docs-deployment
      cancel-in-progress: false
    defaults:
      run:
        shell: bash -el {0}
    steps:
      # Full history: ghp-import commits onto the branch, and a shallow clone
      # cannot be pushed as a fast-forward.
      - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9
        with:
          fetch-depth: 0

      - uses: conda-incubator/setup-miniconda@3b0f2504dd76ef23b6d31f291f4913fb60ab5ff3
        with:
            miniconda-version: "latest"
            activate-environment: spiceql
            channels: conda-forge
            environment-file: environment.yml
            auto-activate-base: false
            auto-update-conda: true

      - name: Conda info
        run: |
            conda info
            conda list

      # ghp-import commits with the configured git identity, and a runner has none.
      - name: Configure git identity
        run: |
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # --force because the branch is generated output: a rebuilt site is not a
      # fast-forward of the last one.
      - name: Build and publish
        working-directory: ${{github.workspace}}
        run: |
          mkdocs gh-deploy --remote-branch docs_deployment --force

      # gh-deploy cleans site/ up after itself, hence the rebuild. Guards against
      # a plugin producing nothing and still exiting 0.
      - name: Check built docs
        working-directory: ${{github.workspace}}
        run: |
          mkdocs build
          test -e site/index.html
